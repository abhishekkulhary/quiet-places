# Publishes the landing page in site/ to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Screenshots, the icon and fonts are copied in from docs/store/ and assets/ so
# they exist in one place only. __REPO__ becomes owner/name, so the download
# buttons point at this repository's releases (and still work in a fork).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir -p _site/img _site/fonts
          cp -R site/. _site/
          cp docs/store/*.png _site/img/
          cp assets/icon/icon.png _site/img/icon.png
          cp assets/fonts/*.ttf _site/fonts/
          sed -i "s|__REPO__|${{ github.repository }}|g" _site/index.html
          sed -i "s|__BUILD_SHA__|${GITHUB_SHA}|g; s|__BUILD__|${GITHUB_SHA::7}|g" _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
